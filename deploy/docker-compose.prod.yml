# Production stack for one VPS: PostgreSQL, the web app, the background worker and Caddy
# (which gets and renews the HTTPS certificate). See docs/vps-deployment.md.
#
#   cp deploy/.env.production.example deploy/.env.production   # then fill it in
#   docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml up -d --build

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: production
  image: picksnap:production
  env_file: .env.production
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: photo
      POSTGRES_USER: photo # maintenance superuser; the app never uses it
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env.production}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    # No ports are published: only the web and worker containers can reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photo -d photo"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    <<: *app
    # Only the web container migrates; the worker waits until this one is healthy.
    command: sh -c "python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    <<: *app
    command: python manage.py procrastinate worker
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep this volume
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
