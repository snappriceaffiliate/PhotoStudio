[project]
name = "photo-selection"
version = "0.1.0"
description = "Photo selection portal for studios: Django backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.2",
    "boto3>=1.35",
    "procrastinate[django]>=3.0",
    "argon2-cffi>=23.1",
    "whitenoise>=6.7",
    "gunicorn>=23.0",
    "sentry-sdk[django]>=2.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
# WhiteNoise warns that collected static files are missing; they only exist in the production image.
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
# Line length is enforced by `ruff format`.
ignore = ["E501"]
