name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: photo
          POSTGRES_USER: photo
          POSTGRES_PASSWORD: photo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U photo -d photo"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Tests run as a non-superuser role so PostgreSQL row-level security is really tested.
      DATABASE_URL: postgres://photo_app:photo_app@localhost:5432/photo
      DJANGO_SECRET_KEY: ci-only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Create the non-superuser app role
        run: psql postgres://photo:photo@localhost:5432/photo -f ../docker/postgres/init.sql
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.11"
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile --target production -t photo-selection:${{ github.sha }} .
